name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  APM_VERSION: 0.31.0

jobs:
  validate:
    name: Validate assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural validation
        run: python3 scripts/validate.py
      - name: Install the pinned APM CLI
        run: |
          curl -sSL https://aka.ms/apm-unix | sh -s -- "@v${APM_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Every primitive parses
        run: apm compile --validate
      - name: Dogfood install is idempotent and audits clean
        run: |
          apm install
          apm install
          apm audit --ci
      - name: Install leaves the tracked tree untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "apm install created or changed tracked files" >&2
            exit 1
          fi
      - name: Consumer smoke test from this checkout
        run: |
          portal="$(mktemp -d)"
          # Same shape as examples/apm.yml, pointed at the checkout instead of a release tag.
          sed -e "s#- jpsmoreira-com/CM-AI-Content-Skills\#v.*#- ${GITHUB_WORKSPACE}#" examples/apm.yml > "$portal/apm.yml"
          bash scripts/smoke-portal.sh "$portal"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1
