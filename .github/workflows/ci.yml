name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTAGENTS_VERSION: 3.0.1

jobs:
  validate:
    name: Validate assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural validation
        run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dotagents install is idempotent and healthy
        run: |
          npx --yes "@sentry/dotagents@${DOTAGENTS_VERSION}" --project install
          npx --yes "@sentry/dotagents@${DOTAGENTS_VERSION}" --project install
          npx --yes "@sentry/dotagents@${DOTAGENTS_VERSION}" --project doctor
      - name: Install leaves the tracked tree untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "dotagents install created or changed tracked files" >&2
            exit 1
          fi

  wiring:
    name: Wiring script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-wiring.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S style scripts/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1
