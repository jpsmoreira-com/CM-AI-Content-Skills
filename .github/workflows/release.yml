name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APM_VERSION: 0.31.0

jobs:
  release:
    name: Verify tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural validation
        run: python3 scripts/validate.py

      - name: Tag matches apm.yml, CHANGELOG.md, and the example pin
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          grep -qE "^version: ${version//./\\.}$" apm.yml \
            || { echo "apm.yml is not version $version" >&2; exit 1; }
          grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## $version' heading" >&2; exit 1; }
          grep -qF "CM-AI-Content-Skills#${tag}" examples/apm.yml \
            || { echo "examples/apm.yml does not pin $tag" >&2; exit 1; }

      - name: Install the pinned APM CLI
        run: |
          curl -sSL https://aka.ms/apm-unix | sh -s -- "@v${APM_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Consumer smoke test from the pushed tag
        run: |
          portal="$(mktemp -d)"
          # Same shape as examples/apm.yml, pointed at the repository that pushed the tag.
          sed -e "s#jpsmoreira-com/CM-AI-Content-Skills#${GITHUB_REPOSITORY}#g" examples/apm.yml > "$portal/apm.yml"
          bash scripts/smoke-portal.sh "$portal"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v) ; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
