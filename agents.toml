# dotagents manifest for this repository. It dogfoods the published assets: whoever
# checks this repo out gets the skills and subagents linked into the tool-native
# folders. Portals consume the GitHub source instead — see examples/agents.toml.
#
#   npx --yes @sentry/dotagents@3.1.0 --project install   # after cloning or pulling
#   npx --yes @sentry/dotagents@3.1.0 --project sync      # after editing skills/ or agents/
#   npx --yes @sentry/dotagents@3.1.0 --project doctor    # health check
version = 1

# "claude" gets .claude/skills -> .agents/skills and .claude/agents/*.md.
# "codex" gets .codex/agents/*.toml. Codex and Copilot read .agents/skills/ natively, so
# "copilot" adds no project files of its own; it declares the support that CI verifies
# and selects ~/.copilot on a user-scope install.
agents = ["claude", "codex", "copilot"]

# Every directory under skills/ with a SKILL.md, picked up automatically.
[[skills]]
name = "*"
source = "path:."
path = "skills"

# Subagents have no wildcard. `path` points dotagents at the file directly, which keeps
# repeated installs idempotent (a bare "path:." source would also match the generated
# copy under .agents/agents/ and fail with "Ambiguous portable matches").
[[subagents]]
name = "docs-style-reviewer"
source = "path:."
path = "agents/docs-style-reviewer.md"
targets = ["claude", "codex"]

[[subagents]]
name = "docs-link-auditor"
source = "path:."
path = "agents/docs-link-auditor.md"
targets = ["claude", "codex"]
