# markdownlint configuration for the repository's own documentation. Run: npx --yes markdownlint-cli2@0.18.1
globs:
  - "**/*.md"
config:
  default: true
  MD013: false # line length: prose is wrapped by the editor
  MD024: { siblings_only: true } # duplicate headings allowed across sections (changelog, decision records)
  MD033: false # inline HTML (managed-block markers)
  MD041: false # first line need not be a heading (managed block, golden examples)
ignores:
  - "evals/**" # fixtures with deliberate problems
  - "skills/style-guide-validator/references/style-guide-full.md" # the style guide is content, not repo docs
  - ".agents/**"
  - ".claude/**"
  - ".codex/**"
  - "node_modules/**"
